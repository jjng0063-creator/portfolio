<!doctype html>
<!-- The content editor. Publicly reachable, but it holds no secrets and does
     nothing until you paste in a GitHub token, which is stored only in this
     browser. Kept out of search results by the noindex tag below. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="robots" content="noindex, nofollow" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9A%99%3C/text%3E%3C/svg%3E"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#08090d" />
    <title>Site editor</title>

    <script>
      // The editor is dark-only: it borrows the site's tokens, which are
      // defined dark-first, and has no theme toggle of its own.
      document.documentElement.setAttribute('data-theme', 'dark');
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/admin/main.tsx"></script>
  </body>
</html>
