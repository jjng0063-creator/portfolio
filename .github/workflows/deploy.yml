name: Deploy to GitHub Pages

# Runs on every push to main — including the commits the admin panel at
# /admin.html makes when you publish, which is what puts an edit live.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. `cancel-in-progress: false` so a queued run finishes
# rather than being dropped: publishing twice in quick succession from the admin
# panel should land both edits, not silently discard the first.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # content.json is written by the admin panel from a browser, so it is the
      # one input to this build nobody reviews. Validate it before spending a
      # build on it — and fail here rather than deploying broken content.
      - run: npm run check

      - run: npm run lint

      - run: npm test

      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
