<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Painted before React boots so there is no white flash on a dark theme -->
    <meta name="theme-color" content="#08090d" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#fbfbfa" media="(prefers-color-scheme: light)" />

    <!-- The <title>, description and og: tags are injected at build time from
         the `meta` block of src/data/content.json, which is what the admin
         panel's "Page & sharing" tab writes. See siteMetaPlugin in
         vite.config.ts. Do not add them here as well — you would get two. -->

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <script>
      // Apply the stored theme before first paint to avoid a flash of the
      // wrong palette. Kept inline and tiny on purpose.
      (function () {
        try {
          var t = localStorage.getItem('portfolio_theme');
          if (t !== 'dark' && t !== 'light') {
            t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          }
          document.documentElement.setAttribute('data-theme', t);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
